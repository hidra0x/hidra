      <stop offset="0" stop-color="#070b12"/>
      <stop offset="0.55" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#120a14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
