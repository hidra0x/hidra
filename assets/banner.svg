    <path d="M900 210 C880 180 900 150 930 140 C960 130 965 105 995 100"/>
    <path d="M900 210 C930 215 945 235 975 235 C1005 235 1010 260 1040 265"/>
    <path d="M900 210 C870 230 865 255 835 260"/>
