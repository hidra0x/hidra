  <text x="76" y="178" fill="#ffb86b" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="3">A12 / iOS 18.7.2 — KERNEL CONTROL RESEARCH</text>
