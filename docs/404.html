<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — HIDRA</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <style>
    :root{--bg:#05070d;--text:#e8eef7;--muted:#8fa3b8;--red:#ff4d4d;--orange:#ff9f43;--blue:#58a6ff}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:
      radial-gradient(800px 500px at 80% 0%,rgba(255,77,77,.14),transparent 60%),
      radial-gradient(700px 500px at 10% 80%,rgba(88,166,255,.10),transparent 60%),
      linear-gradient(180deg,#05070d,#080d16 60%,#05070d);
      color:var(--text);font-family:"Segoe UI",Inter,Helvetica,Arial,sans-serif;text-align:center;padding:24px}
    .card{max-width:620px;border:1px solid rgba(88,166,255,.18);background:rgba(12,19,31,.72);
      border-radius:20px;padding:38px 30px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
    .code{font-family:Consolas,Menlo,monospace;font-size:72px;font-weight:800;letter-spacing:.08em;
      background:linear-gradient(100deg,#fff,#ffd7a8,#ff8a8a,#8fc7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
    h1{font-size:24px;margin:8px 0 6px}
    p{color:var(--muted);margin:0 0 22px}
    a{display:inline-block;padding:11px 18px;border-radius:11px;font-weight:700;text-decoration:none;
      background:linear-gradient(100deg,rgba(255,77,77,.9),rgba(255,159,67,.88));color:#16070b}
  </style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>This head of the hydra is missing</h1>
    <p>The page you asked for is not here. The research is still in the main repository.</p>
    <a href="./">Back to HIDRA</a>
  </div>
</body>
</html>
